amms_waypoint_manager:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    waypoint_names: [home, pick_station, pick_clear, place_approach, place_station, place_clear]
    waypoint_home: [0.0, 0.0, 0.0]
    waypoint_pick_station: [0.85, 0.0, 0.0]
    waypoint_pick_clear: [0.5, 0.0, 0.0]
    # CHANGED: place_approach/place_station/place_clear all moved from the
    # old location (~2.0-2.825, 0.0) to Shelf_A's position in pharma.world
    # (-5, 2.5), approached from the open side (higher x, facing -x /
    # yaw=pi). place_approach and place_clear sit 1m further out along the
    # same line as a staging point before/after the final approach.
    # These x/y values are a first estimate from map geometry, not yet
    # verified against the actual costmap/local planner behavior -- may
    # need tuning after a real test run.
    waypoint_place_approach: [-3.0, 2.5, 3.14159]
    waypoint_place_station: [-4.0, 2.5, 3.14159]
    waypoint_place_clear: [-3.0, 2.5, 0.0]
    pose_array_topic: /amms/waypoints
    marker_topic: /amms/waypoint_markers
    publish_period_sec: 1.0

amms_task_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    repeat_count: 0
    mission_request_service: /amms/start_mission
    pick_zone_waypoint: pick_station
    post_pick_clear_waypoint: ''
    pre_place_route_waypoint: place_approach
    place_zone_waypoint: place_station
    search_return_waypoint: home
    max_mission_objects: 3
    no_object_cycles_before_complete: 1
    use_navigation: true
    frame_id: map
    base_frame: base_link
    detections_topic: /amms/detections
    pick_target_topic: /amms/pick_target
    task_state_topic: /amms/task_state
    nav_action_name: navigate_to_pose
    drive_on_heading_action_name: drive_on_heading
    pick_service: /amms/pick_object
    place_service: /amms/place_object
    fold_arm_service: /amms/fold_arm
    gazebo_get_entity_state_service: /get_entity_state
    use_gazebo_truth_fallback: false
    gazebo_truth_frame: map
    waypoint_names: [home, pick_station, pick_clear, place_approach, place_station, place_clear]
    waypoint_home: [0.0, 0.0, 0.0]
    waypoint_pick_station: [0.85, 0.0, 0.0]
    waypoint_pick_clear: [0.5, 0.0, 0.0]
    waypoint_place_approach: [-3.0, 2.5, 3.14159]
    waypoint_place_station: [-4.0, 2.5, 3.14159]
    waypoint_place_clear: [-3.0, 2.5, 0.0]
    post_place_clear_waypoint: place_clear
    enable_final_alignment: true
    align_target_frame: map
    align_pick_station_target: [1.5, 0.0, 0.0]
    align_pick_station_stop_distance: 0.65
    align_place_station_target: [-4.625, 2.5, 0.0]
    align_place_station_stop_distance: 0.5
    align_timeout_sec: 45.0
    place_final_approach_use_drive_on_heading: true
    place_final_approach_heading_tolerance: 0.35
    place_final_approach_lateral_tolerance: 0.30
    place_final_approach_max_distance: 0.7239375
    place_final_approach_speed: 0.08
    place_final_approach_timeout_sec: 30.0
    place_final_orientation_stage_distance: 0.49359375
    place_final_stage_timeout_sec: 60.0
    place_final_standoff_xy_tolerance: 0.30
    place_final_standoff_yaw_tolerance: 0.40
    object_target_frame: arm_base_link
    object_reachable_min_radius: 0.1447875
    object_reachable_max_radius: 0.9
    object_reachable_min_z: -0.307125
    object_reachable_max_z: 0.23034375
    object_grasp_forward_offset: 0.0
    object_grasp_z_bias: 0.0
    object_grasp_surface_to_center_offset: 0.0
    require_reachable_before_pick_service: true
    pre_pick_detection_required: true
    pre_pick_detection_grace_sec: 0.0
    pick_retry_count: 3
    pick_retry_wait_sec: 0.5
    detection_timeout_sec: 15.0
    detection_freshness_sec: 0.75
    fresh_detection_after_move_timeout_sec: 4.0
    min_detection_confidence: 0.25
    object_nav_standoff_distance: 0.60
    max_reposition_attempts: 3
    max_object_failures: 4
    place_position_arm_base: [0.5659875, 0.0, 0.078975]
    place_slot_reach_adjustments_x: [0.0, -0.026325, -0.05265, -0.078975]
    nav_timeout_sec: 120.0
    nav_retry_count: 3
    nav_retry_wait_sec: 0.75
    position_only_waypoints: [place_station, place_approach, home]
    position_only_goal_tolerance: 0.45
    position_only_min_obstacle_range: 0.25
    backup_action_name: backup
    post_pick_backup_enabled: true
    post_pick_backup_distance: 0.5265
    post_pick_backup_speed: 0.06
    post_pick_backup_timeout_sec: 18.0
    post_place_backup_enabled: true
    post_place_backup_distance: 0.3290625
    post_place_backup_speed: 0.10
    post_place_backup_timeout_sec: 16.0
    nav2_backup_max_segment_distance: 0.16453125
    clear_costmaps_on_nav_failure: true
    local_clear_costmap_service: /local_costmap/clear_entirely_local_costmap
    global_clear_costmap_service: /global_costmap/clear_entirely_global_costmap
    scan_topic: /scan
    obstacle_log_min_range: 0.45
    service_timeout_sec: 90.0
    localization_timeout_sec: 3.0
    startup_timeout_sec: 300.0
    startup_lifecycle_recovery_enabled: true
    startup_lifecycle_recovery_initial_delay_sec: 25.0
    startup_lifecycle_recovery_period_sec: 5.0
    startup_lifecycle_transition_timeout_sec: 8.0
    startup_required_lifecycle_nodes:
      - /map_server
      - /amcl
      - /controller_server
      - /smoother_server
      - /planner_server
      - /behavior_server
      - /bt_navigator
      - /velocity_smoother
