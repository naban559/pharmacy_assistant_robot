k12_object_detector:
  ros__parameters:
    rgb_topic: /camera/depth_camera/image
    depth_topic: /camera/depth_camera/depth_image
    camera_info_topic: /camera/depth_camera/camera_info
    detections_topic: /amms/detections
    pose_array_topic: /amms/detected_object_poses_camera
    debug_image_topic: /amms/detection_debug
    publish_debug_image: true
    min_area_px: 60.0
    confidence_area_px: 500.0
    max_depth_m: 4.5
    projection_mode: ros_optical
    fallback_width: 640
    fallback_height: 480
    fallback_horizontal_fov: 1.047
    sync_queue_size: 10
    sync_slop_sec: 0.05

