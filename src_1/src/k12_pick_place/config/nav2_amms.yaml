amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.2
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.20
    update_min_a: 0.20
    resample_interval: 1
    laser_min_range: 0.45
    laser_max_range: 12.0
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 1.5
    z_hit: 0.85
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.15
    sigma_hit: 0.15
    lambda_short: 0.1
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

