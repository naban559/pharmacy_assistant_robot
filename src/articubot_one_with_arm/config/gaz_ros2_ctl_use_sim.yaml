# ============================================================
# gaz_ros2_ctl_use_sim.yaml — sim-time override file
# Passed as the second <parameters> file to gz_ros2_control
# in four_wheel.trans so all controllers read the GZ clock.
# ============================================================

controller_manager:
  ros__parameters:
    use_sim_time: true  # UNCHANGED

# ADDED: diff_cont and joint_broad entries.
# gz_ros2_control loads this file for every node it spawns;
# without explicit use_sim_time on each controller namespace,
# the controllers fall back to wall-clock time and desync from
# the Ignition simulation clock on fast machines.
diff_cont:
  ros__parameters:
    use_sim_time: true

joint_broad:
  ros__parameters:
    use_sim_time: true

arm_position_controller:
  ros__parameters:
    use_sim_time: true

gripper_position_controller:
  ros__parameters:
    use_sim_time: true
