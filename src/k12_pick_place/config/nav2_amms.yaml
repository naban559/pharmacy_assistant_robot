amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    # AMCL is planar: use the ground frame so map->odom does not cancel the
    # physical base_footprint->base_link height needed by arm/table transforms.
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2000
    # Stable localization updates without continuous particle depletion near stations.
    update_min_d: 0.15
    update_min_a: 0.15
    max_beams: 90
    resample_interval: 1
    recovery_alpha_slow: 0.002
    recovery_alpha_fast: 0.10
    laser_min_range: 0.12
    laser_max_range: 12.0
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    z_hit: 0.80
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.10
    sigma_hit: 0.15
    lambda_short: 0.1
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker, grasp_goal_checker]
    controller_plugins: [FollowPath, FineApproach]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 25.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    grasp_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Verified against the full wheel extent and complete grasp/lift path.
      xy_goal_tolerance: 0.010
      yaw_goal_tolerance: 0.03

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.10
      min_vel_y: 0.0
      max_vel_x: 0.75
      max_vel_y: 0.0
      max_vel_theta: 1.60
      min_speed_xy: 0.0
      max_speed_xy: 0.75
      min_speed_theta: 0.0
      acc_lim_x: 1.20
      acc_lim_y: 0.0
      acc_lim_theta: 2.50
      decel_lim_x: -1.50
      decel_lim_y: 0.0
      decel_lim_theta: -2.50
      # Trajectory sampling
      vx_samples: 24
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.7
      linear_granularity: 0.025
      angular_granularity: 0.02
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - PathDist
        - GoalDist
      # Smooth path tracking without GoalAlign/PathAlign yaw hunting:
      ObstacleFootprint.scale: 0.02
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 14.0
      RotateToGoal.slowing_factor: 0.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.2
      Oscillation.x_only_threshold: 0.03
      Oscillation.scale: 5.0

    FineApproach:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.05
      min_vel_y: 0.0
      max_vel_x: 0.12
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      min_speed_theta: 0.0
      acc_lim_x: 0.96
      acc_lim_y: 0.0
      acc_lim_theta: 2.50
      decel_lim_x: -1.20
      decel_lim_y: 0.0
      decel_lim_theta: -2.50
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.2
      linear_granularity: 0.015
      angular_granularity: 0.02
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.010
      trans_stopped_velocity: 0.015
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - PathDist
        - GoalDist
      ObstacleFootprint.scale: 0.02
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 14.0
      RotateToGoal.slowing_factor: 0.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.2
      Oscillation.x_only_threshold: 0.03
      Oscillation.scale: 2.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: true
      use_final_approach_orientation: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.20

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.75, 0.0, 1.60]
    min_velocity: [-0.15, 0.0, -1.60]
    max_accel: [1.20, 0.0, 2.50]
    max_decel: [-1.50, 0.0, -2.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 15.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.025
      # Wheel centres are at x=+/-0.195 with a 0.06 m collision radius.
      footprint: "[[0.24, 0.16], [0.24, -0.16], [-0.24, -0.16], [-0.24, 0.16]]"
      footprint_padding: 0.005
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.10
          obstacle_max_range: 6.0
          obstacle_min_range: 0.10
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        # Clears docking approach to 0.42m standoff without false costmap inflation.
        inflation_radius: 0.05
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      width: 12
      height: 10
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.24, 0.16], [0.24, -0.16], [-0.24, -0.16], [-0.24, 0.16]]"
      footprint_padding: 0.005
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.10
          obstacle_max_range: 6.0
          obstacle_min_range: 0.10
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.05
      always_send_full_costmap: true
