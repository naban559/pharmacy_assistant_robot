pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /velodyne_points
    scan_topic: /scan
    target_frame: lidar_1
    transform_tolerance: 0.05
    min_height: -0.10
    max_height: 0.35
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.10
    range_min: 0.25
    range_max: 12.0
    use_inf: true
    min_points_per_beam: 1
    use_median_range: true
    reject_isolated_returns: true
    isolation_window: 2
    isolation_max_range_delta: 0.75
    self_filter_enabled: true
    self_filter_frame: base_link
    self_filter_min_x: -0.75
    self_filter_max_x: 1.05
    self_filter_min_y: -0.50
    self_filter_max_y: 0.50
    self_filter_min_z: -0.05
    self_filter_max_z: 0.95
