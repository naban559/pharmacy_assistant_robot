planning_plugin: ompl_interface/OMPLPlanner
planning_adapters:
  - default_planner_request_adapters/AddTimeParameterization
  - default_planner_request_adapters/FixWorkspaceBounds
  - default_planner_request_adapters/FixStartStateBounds
  - default_planner_request_adapters/FixStartStateCollision
  - default_planner_request_adapters/FixStartStatePathConstraints

# Max velocity scaling for plan execution (conservative for Gazebo)
max_acceleration_scaling_factor: 0.5
max_velocity_scaling_factor: 0.5

# OMPL planner configuration
ompl:
  planning_groups:
    arm:
      default_planner_config: RRTConnect
      enforce_joint_model_state_space: true
      projection_evaluator: joints(arm_base_yaw_joint,arm_shoulder_pitch_joint,arm_elbow_pitch_joint)
      minimum_waypoint_count: 10
      maximum_waypoint_count: 1000
