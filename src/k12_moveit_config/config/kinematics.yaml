arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
  velocity_scale: 0.5
  # RViz position-only requests may use KDL. The task commander supplies
  # explicit URDF-matched joint goals and validates fixed-orientation paths;
  # it does not depend on unconstrained KDL pose solutions for grasping.
