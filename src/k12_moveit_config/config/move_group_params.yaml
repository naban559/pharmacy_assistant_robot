/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    controller_names:
      - arm_position_controller

    arm_position_controller:
      type: FollowJointTrajectory
      action_ns: follow_joint_trajectory
      default: true
      joints:
        - arm_base_yaw_joint
        - arm_shoulder_pitch_joint
        - arm_elbow_pitch_joint
        - arm_wrist_pitch_joint
        - arm_wrist_roll_joint

    robot_description_kinematics:
      arm:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.05
        position_only_ik: false
        elbow_pitch_joint_min: -2.618
        elbow_pitch_joint_max: 2.618

    planning_pipelines:
      pipeline_names:
        - ompl
      ompl:
        planning_plugin: ompl_interface/OMPLPlanner
        start_state_max_bounds_error: 0.1
        jiggle_fraction: 0.05
        request_adapters: >-
            default_planner_request_adapters/AddTimeOptimalParameterization
            default_planner_request_adapters/ResolveConstraintFrames
            default_planner_request_adapters/FixWorkspaceBounds
            default_planner_request_adapters/FixStartStateBounds
            default_planner_request_adapters/FixStartStateCollision
            default_planner_request_adapters/FixStartStatePathConstraints
        enforce_joint_model_state_space: true
        projection_evaluator: joints(arm_base_yaw_joint,arm_shoulder_pitch_joint,arm_elbow_pitch_joint)
        planner_configs:
          RRTConnect:
            type: geometric::RRTConnect
            range: 0.0
          RRT:
            type: geometric::RRT
            range: 0.0
            goal_bias: 0.05
          RRTstar:
            type: geometric::RRTstar
            range: 0.0
            goal_bias: 0.05
            delay_collision_checking: true
          PRM:
            type: geometric::PRM
            max_nearest_neighbors: 10
          PRMstar:
            type: geometric::PRMstar

    default_planning_pipeline: ompl

    robot_description_planning:
      joint_limits:
        arm_base_yaw_joint:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        arm_shoulder_pitch_joint:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        arm_elbow_pitch_joint:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        arm_wrist_pitch_joint:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        arm_wrist_roll_joint:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        gripper_left_finger_joint:
          has_velocity_limits: true
          max_velocity: 1.0
          has_acceleration_limits: true
          max_acceleration: 5.0
        gripper_right_finger_joint:
          has_velocity_limits: true
          max_velocity: 1.0
          has_acceleration_limits: true
          max_acceleration: 5.0

    publish_planning_scene: true
    publish_geometry_updates: true
    publish_state_updates: true
    publish_transforms_updates: true
    moveit_manage_controllers: true
    use_sim_time: true
